# Panel de administración (Decap CMS) — ONG Nuestros Orígenes
# Cuando el dominio .cl funcione, reemplaza https://ong-nuestros-origenes.vercel.app por él (3 líneas)

backend:
  name: github
  repo: pahnvee/ong-nuestros-origenes
  branch: main
  base_url: https://ong-nuestros-origenes.vercel.app   # cambiar por el dominio .cl cuando funcione
  auth_endpoint: api/auth                  # login con GitHub (carpeta /api)
  commit_messages:
    update: "Panel: actualiza {{collection}}"
    uploadMedia: "Panel: sube {{path}}"
    deleteMedia: "Panel: borra {{path}}"

locale: es
site_url: https://ong-nuestros-origenes.vercel.app
display_url: https://ong-nuestros-origenes.vercel.app
logo_url: ../assets/logo-panel.svg

# Todas las fotos que se suben desde el panel quedan aquí (ruta relativa, sin "/" inicial)
media_folder: "assets/img/subidas"
public_folder: "assets/img/subidas"

collections:
  # ---------------------------------------------------------------- EVENTOS
  - name: "eventos"
    label: "Eventos"
    description: "El PRIMER evento de la lista aparece en grande como evento principal en Noticias y en el Inicio. Cada evento nuevo se agrega arriba; puedes arrastrarlos para cambiar el orden."
    files:
      - name: "lista"
        label: "Lista de eventos"
        file: "data/eventos.json"
        fields:
          - label: "Eventos"
            label_singular: "evento"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Fecha y hora"
                name: "fecha"
                widget: "datetime"
                format: "YYYY-MM-DDTHH:mm"
                date_format: "DD-MM-YYYY"
                time_format: "HH:mm"
              - label: "Descripción corta"
                name: "descripcion"
                widget: "text"
                hint: "Dos o tres líneas: qué es y para quién."
              - label: "Imagen"
                name: "imagen"
                widget: "image"
                required: false
                choose_url: false
                hint: "Opcional. Foto JPG o PNG; idealmente de menos de 2 MB."
              - label: "Lugar"
                name: "lugar"
                widget: "string"
                required: false
                hint: "Opcional. Dirección, por ejemplo: Calle Jorge Rivera #967, Rancagua. Agrega un botón al mapa."

  # ---------------------------------------------------------------- PRODUCTOS
  - name: "productos"
    label: "Productos"
    description: "Productos del Bazar Dign@ y Emporio. Aparecen en la página Bazar en el mismo orden que aquí."
    files:
      - name: "lista"
        label: "Lista de productos"
        file: "data/productos.json"
        fields:
          - label: "Productos"
            label_singular: "producto"
            name: "productos"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.nombre}} · ${{fields.precio}}"
            fields:
              - label: "Nombre"
                name: "nombre"
                widget: "string"
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                default: "bazar"
                options:
                  - { label: "Bazar Dign@ (ropa y accesorios)", value: "bazar" }
                  - { label: "Emporio", value: "emporio" }
                  - { label: "Vivero urbano", value: "vivero" }
                  - { label: "Artesanía", value: "artesania" }
              - label: "Precio (en pesos, sin puntos)"
                name: "precio"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "Ejemplo: 4500"
              - label: "Descripción corta"
                name: "descripcion"
                widget: "string"
                required: false
              - label: "Foto"
                name: "imagen"
                widget: "image"
                required: false
                choose_url: false
                hint: "Opcional. Si no subes foto, se muestra el logo con el color de la categoría."
              - label: "Disponible"
                name: "disponible"
                widget: "boolean"
                default: true
                hint: "Apágalo cuando se agote: el producto se oculta de la tienda sin borrarlo."

  # ---------------------------------------------------------------- GALERÍA
  - name: "galeria"
    label: "Galería"
    description: "Fotos de la línea de tiempo. Se ordenan solas por año, de la más antigua a la más reciente."
    files:
      - name: "fotos"
        label: "Fotos de la galería"
        file: "data/galeria.json"
        fields:
          - label: "Fotos"
            label_singular: "foto"
            name: "fotos"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.anio}} · {{fields.titulo}}"
            fields:
              - label: "Foto"
                name: "imagen"
                widget: "image"
                required: false
                choose_url: false
                hint: "Sube la foto aquí (JPG o PNG, idealmente de menos de 2 MB)."
              - label: "Título"
                name: "titulo"
                widget: "string"
                hint: "Ejemplo: Feria navideña en la Intendencia"
              - label: "Año"
                name: "anio"
                widget: "number"
                value_type: "int"
                default: 2026
                min: 2000
                max: 2100
              - label: "Video (opcional, avanzado)"
                name: "video"
                widget: "file"
                required: false
                choose_url: false
                hint: "Normalmente se deja vacío. Solo para videos MP4 cortos."
