<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · ONG Nuestros Orígenes</title>
  <!-- Ruta fija para que funcione tanto en /admin como en /admin/ -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <script>
    if (location.pathname === "/admin") location.replace("/admin/" + location.hash);
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- Decap CMS: lee admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // El login usa la misma dirección desde la que se abre el panel,
    // así funciona igual en ong-nuestros-origenes.vercel.app y en nuestrosorigenes.cl.
    var origin = window.location.origin;
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "lautaropps2/ong-nuestros-origenes",
          branch: "main",
          base_url: origin,
          auth_endpoint: "api/auth"
        },
        site_url: origin,
        display_url: origin
      }
    });
  </script>
  <!-- Acceso a los pedidos de la Biblioteca del Barrio (QR y estado de cada libro) -->
  <a href="/admin/pedidos" id="pedidos-link"
     style="position:fixed;right:18px;bottom:18px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:#F7D417;color:#0A0A0A;font:600 15px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-decoration:none;box-shadow:0 10px 26px -10px rgba(0,0,0,.55),0 0 0 2px #0A0A0A">
    <svg width="20" height="20" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="17" y="4" width="7" height="7" rx="1"/><rect x="4" y="17" width="7" height="7" rx="1"/><path d="M17 17h3v3h-3zM21 21h3v3h-3z"/></svg>
    Pedidos de libros
  </a>
</body>
</html>
