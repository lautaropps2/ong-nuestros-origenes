<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · ONG Nuestros Orígenes</title>
  <!-- Ruta fija para que funcione tanto en /admin como en /admin/ -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <script>
    if (location.pathname === "/admin") location.replace("/admin/" + location.hash);
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <!-- Decap CMS: lee admin/config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // El login usa la misma dirección desde la que se abre el panel,
    // así funciona igual en ong-nuestros-origenes.vercel.app y en nuestrosorigenes.cl.
    var origin = window.location.origin;
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "lautaropps2/ong-nuestros-origenes",
          branch: "main",
          base_url: origin,
          auth_endpoint: "api/auth"
        },
        site_url: origin,
        display_url: origin
      }
    });
  </script>
</body>
</html>
